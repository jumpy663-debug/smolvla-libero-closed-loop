<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SmolVLA LIBERO 复现实验结果</title>
  <desc id="desc">闭环成功率对比、LoRA 参数效率和动作执行窗口消融。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#background)"/>
  <text x="64" y="70" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">
    SmolVLA × LIBERO：闭环实验结果
  </text>
  <text x="64" y="105" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="17">
    RTX 4060 Laptop GPU · 完全相同的任务、种子、初始状态与 H=10 评测
  </text>

  <g filter="url(#shadow)">
    <rect x="48" y="137" width="690" height="300" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="762" y="137" width="390" height="300" rx="20" fill="#111827" stroke="#334155"/>
    <rect x="48" y="461" width="1104" height="167" rx="20" fill="#111827" stroke="#334155"/>
  </g>

  <text x="76" y="180" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">
    配对微调评测
  </text>
  <text x="76" y="210" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="15">
    Task 5 / 4 / 7 / 8 · 每任务 3 个回合
  </text>

  <text x="76" y="258" fill="#cbd5e1" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17">预训练</text>
  <rect x="220" y="235" width="420" height="32" rx="8" fill="#1e293b"/>
  <rect x="220" y="235" width="245" height="32" rx="8" fill="#38bdf8"/>
  <text x="655" y="258" text-anchor="end" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">7/12</text>

  <text x="76" y="324" fill="#cbd5e1" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="17">动作专家微调</text>
  <rect x="220" y="301" width="420" height="32" rx="8" fill="#1e293b"/>
  <rect x="220" y="301" width="210" height="32" rx="8" fill="#fb7185"/>
  <text x="655" y="324" text-anchor="end" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">6/12</text>
  <text x="220" y="353" fill="#fda4af" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14">Task 7 丢失 1 条原有成功</text>

  <text x="76" y="397" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">LoRA r=16</text>
  <rect x="220" y="374" width="420" height="32" rx="8" fill="#1e293b"/>
  <rect x="220" y="374" width="245" height="32" rx="8" fill="#34d399"/>
  <text x="655" y="397" text-anchor="end" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">7/12</text>
  <text x="220" y="426" fill="#6ee7b7" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="14">保留全部 7 条原有成功</text>

  <text x="790" y="180" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">
    LoRA 参数效率
  </text>
  <text x="790" y="240" fill="#34d399" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">134.5×</text>
  <text x="790" y="265" fill="#94a3b8" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15">可训练参数减少</text>
  <text x="790" y="323" fill="#38bdf8" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">3.0 MB</text>
  <text x="790" y="348" fill="#94a3b8" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15">adapter 对比 906.7 MB 完整模型</text>
  <text x="790" y="401" fill="#c4b5fd" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">−20.9%</text>
  <text x="930" y="401" fill="#94a3b8" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15">峰值训练显存</text>

  <text x="76" y="505" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">
    动作执行窗口消融
  </text>
  <text x="76" y="535" fill="#94a3b8" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="15">相同四任务子集，预训练 checkpoint</text>

  <text x="480" y="501" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">H=50</text>
  <rect x="535" y="480" width="360" height="28" rx="8" fill="#1e293b"/>
  <rect x="535" y="480" width="60" height="28" rx="8" fill="#64748b"/>
  <text x="915" y="501" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">2/12 · 16.7%</text>

  <text x="480" y="551" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">H=25</text>
  <rect x="535" y="530" width="360" height="28" rx="8" fill="#1e293b"/>
  <rect x="535" y="530" width="180" height="28" rx="8" fill="#818cf8"/>
  <text x="915" y="551" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">6/12 · 50.0%</text>

  <text x="480" y="601" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">H=10</text>
  <rect x="535" y="580" width="360" height="28" rx="8" fill="#1e293b"/>
  <rect x="535" y="580" width="210" height="28" rx="8" fill="#38bdf8"/>
  <text x="915" y="601" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">7/12 · 58.3%</text>

  <text x="64" y="658" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">
    两种微调的离线 flow-matching loss 均有改善；只有配对闭环评测暴露了负迁移。
  </text>
</svg>
