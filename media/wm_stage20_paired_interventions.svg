<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Stage 20 配对动作干预完整观测回采</title>
  <desc id="desc">展示 fresh-reset 筛选结果、六组 nominal 与 motion-dropout 配对步数，以及全部故障导致失败的结果。</desc>
  <rect width="1100" height="620" fill="#f7f9fc"/>
  <text x="550" y="39" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17233c">Stage 20：配对动作干预完整观测回采</text>
  <text x="550" y="69" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#53627a">同任务 · 同初始状态 · 同 seed · 独立 fresh env · step 50 起 persistent motion dropout</text>

  <rect x="35" y="94" width="330" height="443" rx="14" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="200" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17233c">Fresh-reset 固定筛选</text>
  <text x="200" y="151" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53627a">每任务固定 4 个候选，不提前停止</text>
  <g font-family="sans-serif" font-size="14" fill="#17233c">
    <text x="65" y="210" font-weight="700">Task 4</text><text x="145" y="210">2 / 4 成功</text>
    <text x="65" y="285" font-weight="700">Task 7</text><text x="145" y="285">4 / 4 成功</text>
    <text x="65" y="360" font-weight="700">Task 8</text><text x="145" y="360">4 / 4 成功</text>
  </g>
  <g>
    <rect x="65" y="225" width="120" height="18" rx="4" fill="#27a56a"/><rect x="185" y="225" width="120" height="18" rx="4" fill="#df5b57"/>
    <rect x="65" y="300" width="240" height="18" rx="4" fill="#27a56a"/>
    <rect x="65" y="375" width="240" height="18" rx="4" fill="#27a56a"/>
  </g>
  <rect x="65" y="430" width="240" height="72" rx="8" fill="#fff3cd"/>
  <text x="185" y="454" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b5500">Reset 历史依赖被捕获</text>
  <text x="185" y="476" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b5500">历史初始观测仅 8 / 12</text>
  <text x="185" y="494" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b5500">与 fresh reset 指纹一致</text>

  <rect x="385" y="94" width="680" height="443" rx="14" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="725" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17233c">六组严格配对控制步数</text>
  <text x="725" y="151" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53627a">绿色：nominal 成功 · 红色：motion dropout 失败并运行至 280 步</text>

  <g font-family="sans-serif" font-size="12" fill="#17233c" text-anchor="end">
    <text x="500" y="202">T4 / init 8</text>
    <text x="500" y="257">T4 / init 5</text>
    <text x="500" y="312">T7 / init 6</text>
    <text x="500" y="367">T7 / init 4</text>
    <text x="500" y="422">T8 / init 14</text>
    <text x="500" y="477">T8 / init 24</text>
  </g>
  <!-- Scale: 1.65 px per control step, nominal begins at x=520, fault at x=520 -->
  <g fill="#df5b57">
    <rect x="520" y="183" width="462" height="17" rx="4"/>
    <rect x="520" y="238" width="462" height="17" rx="4"/>
    <rect x="520" y="293" width="462" height="17" rx="4"/>
    <rect x="520" y="348" width="462" height="17" rx="4"/>
    <rect x="520" y="403" width="462" height="17" rx="4"/>
    <rect x="520" y="458" width="462" height="17" rx="4"/>
  </g>
  <g fill="#27a56a">
    <rect x="520" y="204" width="216" height="17" rx="4"/>
    <rect x="520" y="259" width="201" height="17" rx="4"/>
    <rect x="520" y="314" width="178" height="17" rx="4"/>
    <rect x="520" y="369" width="196" height="17" rx="4"/>
    <rect x="520" y="424" width="150" height="17" rx="4"/>
    <rect x="520" y="479" width="153" height="17" rx="4"/>
  </g>
  <g font-family="sans-serif" font-size="11" font-weight="700">
    <text x="990" y="197" fill="#a5322e">280</text><text x="742" y="218" fill="#13734a">131</text>
    <text x="990" y="252" fill="#a5322e">280</text><text x="727" y="273" fill="#13734a">122</text>
    <text x="990" y="307" fill="#a5322e">280</text><text x="704" y="328" fill="#13734a">108</text>
    <text x="990" y="362" fill="#a5322e">280</text><text x="722" y="383" fill="#13734a">119</text>
    <text x="990" y="417" fill="#a5322e">280</text><text x="676" y="438" fill="#13734a">91</text>
    <text x="990" y="472" fill="#a5322e">280</text><text x="679" y="493" fill="#13734a">93</text>
  </g>

  <rect x="35" y="557" width="1030" height="42" rx="9" fill="#e5f5ed" stroke="#9bd2b9"/>
  <text x="550" y="576" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#13734a">结果：6 / 6 nominal 成功，6 / 6 motion dropout 失败；故障有效性门槛 4 / 6 → 通过。</text>
  <text x="550" y="593" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#13734a">初始观测、干预前 50 步命令动作与 51 帧观测全部逐位一致；下一步进行冻结 WM 配对评分。</text>
</svg>
