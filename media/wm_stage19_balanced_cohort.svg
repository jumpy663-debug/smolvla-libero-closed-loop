<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Stage 19 平衡队列修订与可行性审计</title>
  <desc id="desc">展示 Task 8 两个固定初始状态块的成功失败分布、三任务平衡门槛，以及队列未冻结的结论。</desc>
  <rect width="1100" height="620" fill="#f7f9fc"/>
  <text x="550" y="39" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#17233c">Stage 19：平衡队列修订与可行性审计</text>
  <text x="550" y="69" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#53627a">Task 8 固定扩展 15—26 · 不按结果提前停止 · WM 分数计算 0</text>

  <rect x="35" y="94" width="565" height="443" rx="14" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="317" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17233c">Task 8：两个预定义状态块</text>
  <g font-family="sans-serif" font-size="14" fill="#17233c" text-anchor="end">
    <text x="165" y="210">Stage 18 · 3—14</text>
    <text x="165" y="300">Stage 19 · 15—26</text>
    <text x="165" y="390">合并 · 3—26</text>
  </g>
  <g stroke="#e7ebf2">
    <line x1="185" y1="170" x2="555" y2="170"/>
    <line x1="185" y1="260" x2="555" y2="260"/>
    <line x1="185" y1="350" x2="555" y2="350"/>
    <line x1="185" y1="440" x2="555" y2="440"/>
  </g>

  <rect x="185" y="184" width="300" height="38" rx="5" fill="#27a56a"/>
  <rect x="485" y="184" width="60" height="38" rx="5" fill="#df5b57"/>
  <rect x="185" y="274" width="360" height="38" rx="5" fill="#27a56a"/>
  <rect x="185" y="364" width="330" height="38" rx="5" fill="#27a56a"/>
  <rect x="515" y="364" width="30" height="38" rx="5" fill="#df5b57"/>

  <g font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="335" y="208">成功 10</text><text x="515" y="208">失败 2</text>
    <text x="365" y="298">成功 12 · 失败 0</text>
    <text x="350" y="388">成功 22</text><text x="530" y="388">2</text>
  </g>
  <rect x="185" y="463" width="360" height="46" rx="8" fill="#fde9e8"/>
  <text x="365" y="482" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#a5322e">仍缺第 3 个失败</text>
  <text x="365" y="500" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7c4543">不能事后降低门槛，也不继续搜索到命中为止</text>

  <rect x="620" y="94" width="445" height="443" rx="14" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="842" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17233c">三任务 cohort 门槛</text>
  <text x="842" y="151" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53627a">每任务至少 3 成功 / 3 失败</text>

  <g font-family="sans-serif" font-size="14" fill="#17233c">
    <text x="660" y="210" font-weight="700">Task 4</text><text x="745" y="210">8 成功 / 4 失败</text>
    <rect x="945" y="184" width="76" height="34" rx="17" fill="#e5f5ed"/><text x="983" y="206" text-anchor="middle" fill="#13734a" font-weight="700">通过</text>

    <text x="660" y="285" font-weight="700">Task 7</text><text x="745" y="285">9 成功 / 3 失败</text>
    <rect x="945" y="259" width="76" height="34" rx="17" fill="#e5f5ed"/><text x="983" y="281" text-anchor="middle" fill="#13734a" font-weight="700">通过</text>

    <text x="660" y="360" font-weight="700">Task 8</text><text x="745" y="360">22 成功 / 2 失败</text>
    <rect x="945" y="334" width="76" height="34" rx="17" fill="#fde9e8"/><text x="983" y="356" text-anchor="middle" fill="#a5322e" font-weight="700">阻塞</text>
  </g>

  <rect x="650" y="403" width="385" height="104" rx="9" fill="#f0f4fa"/>
  <text x="842" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#17233c">冻结结果</text>
  <text x="842" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#53627a">balanced cohort：0</text>
  <text x="842" y="477" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#53627a">calibration：0 · test：0</text>
  <text x="842" y="497" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53627a">Task 5：0/12 成功，仅保留为 stress set</text>

  <rect x="35" y="557" width="1030" height="42" rx="9" fill="#fff3cd" stroke="#f0d47a"/>
  <text x="550" y="576" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b5500">结论：停止机会性搜索自然失败；下一步转向同任务、同初始状态的配对动作干预。</text>
  <text x="550" y="593" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b5500">目标：检验冻结 WM 是否感知 action–consequence mismatch，而不是继续利用任务难度差异。</text>
</svg>
